<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — LabSystem</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="login-main">
  <div class="modal login-card">
    <h2 id="titulo-formulario">Entrar</h2>

    <form id="form-auth">
      <label for="username">Usuário</label>
      <input type="text" id="username" required>

      <label for="password">Senha</label>
      <input type="password" id="password" required minlength="6">

      <div id="campos-cadastro" class="campos-cadastro hidden">
        <label for="nome">Nome</label>
        <input type="text" id="nome">

        <label for="email">E-mail</label>
        <input type="email" id="email">

        <label for="telefone">Telefone</label>
        <input type="text" id="telefone">
      </div>

      <p id="form-erros" class="erros"></p>

      <div class="modal-botoes login-botoes">
        <button type="submit" id="btn-enviar">Entrar</button>
      </div>
    </form>

    <p class="login-alternar">
      <a href="#" id="link-alternar">Ainda não tem conta? Cadastre-se</a>
    </p>
  </div>
</main>

<script src="demo-api.js"></script>
<script src="login.js"></script>
</body>
</html>
