<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabSystem — Produtos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-brand-icon">◆</span>
      <span class="sidebar-brand-text">LabSystem</span>
      <button id="btn-menu" class="btn-menu" type="button" aria-label="Recolher ou expandir menu">‹</button>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link active">
        <span class="sidebar-link-icon">▤</span>
        <span class="sidebar-link-text">Produtos</span>
      </a>
      <a href="usuarios.html" class="sidebar-link">
        <span class="sidebar-link-icon">☺</span>
        <span class="sidebar-link-text">Usuários</span>
      </a>
    </nav>
  </aside>

  <div class="app-content">
    <header class="content-header">
      <h1>Produtos</h1>
      <button id="btn-novo">+ Novo Produto</button>

      <div class="perfil" id="perfil">
        <button class="perfil-trigger" id="perfil-trigger" type="button" aria-label="Menu do usuário">
          <span class="perfil-seta">⌄</span>
        </button>

        <div class="perfil-menu" id="perfil-menu">
          <div class="perfil-menu-usuario" id="usuario-logado"></div>
          <div class="perfil-menu-divisor"></div>
          <button id="btn-logout" type="button">
            <span>⏻</span> Sair
          </button>
        </div>
      </div>
    </header>

    <main>
      <p id="mensagem" class="mensagem"></p>

      <div class="toolbar">
        <div class="campo-busca">
          <input type="text" id="filtro-busca" placeholder="Buscar produto">
        </div>
        <select id="filtro-categoria" aria-label="Filtrar por categoria">
          <option value="">Todas as categorias</option>
          <option value="Hardware">Hardware</option>
          <option value="Periféricos">Periféricos</option>
          <option value="Componentes">Componentes</option>
          <option value="Armazenamento">Armazenamento</option>
          <option value="Redes">Redes</option>
          <option value="Informática">Informática</option>
          <option value="Outros">Outros</option>
        </select>
        <button id="btn-limpar-filtro" type="button">Limpar</button>
      </div>

      <div class="table-wrapper hidden" id="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="th-ordenavel" data-coluna="id">ID</th>
              <th class="th-ordenavel" data-coluna="created_at">Data de Cadastro</th>
              <th class="th-ordenavel" data-coluna="created_by">Usuário</th>
              <th>Categoria</th>
              <th class="th-ordenavel" data-coluna="description">Descrição</th>
              <th class="th-ordenavel" data-coluna="quantity">Quantidade</th>
              <th class="th-ordenavel" data-coluna="price">Valor</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos">
            <!-- linhas inseridas via JavaScript -->
          </tbody>
        </table>
      </div>

      <div class="estado-vazio hidden" id="estado-vazio">
        <div class="estado-vazio-icone">📦</div>
        <h2>Nenhum produto cadastrado.</h2>
        <p>Clique em "+ Novo Produto" para iniciar.</p>
      </div>
    </main>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <h2 id="modal-titulo">Novo Produto</h2>

    <form id="form-produto">
      <input type="hidden" id="produto-id">

      <label for="categoria">Categoria</label>
      <select id="categoria" required>
        <option value="" disabled selected>Selecione uma categoria</option>
        <option value="Hardware">Hardware</option>
        <option value="Periféricos">Periféricos</option>
        <option value="Componentes">Componentes</option>
        <option value="Armazenamento">Armazenamento</option>
        <option value="Redes">Redes</option>
        <option value="Informática">Informática</option>
        <option value="Outros">Outros</option>
      </select>

      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" required>

      <label for="quantidade">Quantidade</label>
      <input type="number" id="quantidade" min="0" step="1" required>

      <label for="valor">Valor (R$)</label>
      <input type="number" id="valor" min="0.01" step="0.01" required>

      <p id="form-erros" class="erros"></p>

      <div class="modal-botoes">
        <button type="button" id="btn-cancelar">Cancelar</button>
        <button type="submit">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="demo-api.js"></script>
<script src="script.js"></script>
</body>
</html>
